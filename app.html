<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trolling Calculator</title>

    <link rel="stylesheet" href="style.css">

    <!-- Libreria grafico -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Script calcolo -->
    <script src="calculator.js"></script>
    <script src="app.js"></script>
</head>

<body>

    <h1>Trolling Calculator</h1>

    <div class="container">

        <h2>Inserisci i dati</h2>

        <label for="speed">Velocità (nodi):</label>
        <input type="number" id="speed" step="0.1">

        <label for="diameter">Diametro lenza (mm):</label>
        <input type="number" id="diameter" step="0.01">

        <label for="lipWidth">Larghezza pala (mm):</label>
        <input type="number" id="lipWidth" step="0.1">

        <label for="lipLength">Lunghezza pala (mm):</label>
        <input type="number" id="lipLength" step="0.1">

        <label for="lureLength">Lunghezza artificiale (mm):</label>
        <input type="number" id="lureLength" step="0.1">

        <label for="theoreticalDepth">Affondamento teorico dichiarato (m):</label>
        <input type="number" id="theoreticalDepth" step="0.1">

        <label for="targetDepth">Profondità desiderata (m):</label>
        <input type="number" id="targetDepth" step="0.1">

        <div class="buttons">
            <button onclick="calculate()">Calcola</button>
            <button onclick="resetCalculator()">Reset</button>
        </div>

        <h2>Risultati</h2>

        <p><strong>Profondità reale dell’artificiale:</strong>
            <span id="realDepth">--</span>
        </p>

        <p><strong>Lenza da calare:</strong>
            <span id="lineOut">--</span>
        </p>

        <h2>Curva di affondamento</h2>

        <canvas id="depthChart" width="400" height="250"></canvas>

    </div>

</body>
</html>
