<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trolling Calculator Pro</title>

    <!-- Foglio di stile -->
    <link rel="stylesheet" href="style.css">

    <!-- Script del calcolatore -->
    <script src="calculator.js"></script>
    <script src="app.js"></script>

    <!-- Libreria per il grafico -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <h1>Trolling Calculator Pro</h1>

    <div class="container">

        <h2>Inserisci i dati</h2>

        <label>Velocità (nodi):</label>
        <input type="number" id="speed" step="0.1">

        <label>Diametro lenza (mm):</label>
        <input type="number" id="diameter" step="0.1">

        <label>Larghezza pala (mm):</label>
        <input type="number" id="lipWidth">

        <label>Lunghezza pala (mm):</label>
        <input type="number" id="lipLength">

        <label>Lunghezza artificiale (mm):</label>
        <input type="number" id="lureLength">

        <label>Affondamento teorico dichiarato (m):</label>
        <input type="number" id="theoreticalDepth" step="0.1">

        <label>Profondità desiderata (m):</label>
        <input type="number" id="targetDepth" step="0.1">

        <button onclick="calculate()">Calcola</button>
        <button onclick="resetCalculator()">Reset</button>

        <h2>Risultati</h2>

        <p>Profondità reale dell'artificiale:  
            <span id="realDepth" style="font-weight:bold;">--</span>
        </p>

        <p>Lenza da calare:  
            <span id="lineOut" style="font-weight:bold;">--</span>
        </p>

        <h2>Curva di affondamento</h2>

        <!-- Grafico -->
        <canvas id="depthChart" width="400" height="250"></canvas>

    </div>

</body>
</html>
