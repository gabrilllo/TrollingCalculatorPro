<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trolling Calculator Pro – Tool Gratis</title>
<link rel="stylesheet" href="style.css">
<script src="calculator.js"></script>
<script src="app.js"></script>
</head>

<body>

<header style="text-align:center; padding:30px 20px;">
    <h1>Tool Gratuito – Trolling Calculator Pro</h1>
    <p>Calcola la profondità reale dell’artificiale in base alle condizioni di traina.</p>
</header>

<section style="max-width:800px; margin:auto; padding:20px;">

    <h2>⚙️ Inserisci i dati</h2>

    <label>Velocità (nodi):</label><br>
    <input id="speed" type="number" step="0.1"><br><br>

    <label>Diametro filo (mm):</label><br>
    <input id="diameter" type="number" step="0.01"><br><br>

    <label>Tipo di paletta:</label><br>
    <select id="palette">
        <option value="small">Piccola</option>
        <option value="medium">Media</option>
        <option value="large">Grande</option>
    </select><br><br>

    <label>Profondità dichiarata (m):</label><br>
    <input id="declaredDepth" type="number" step="0.1"><br><br>

    <button onclick="calculate()" 
            style="padding:10px 20px; background:#007bff; color:white; border:none; border-radius:6px;">
        Calcola profondità reale
    </button>

    <h3 style="margin-top:20px;">Risultato:</h3>
    <div id="result" style="font-size:20px; font-weight:bold;"></div>

    <!-- BANNER PRO -->
    <div style="margin-top:30px; padding:15px; background:#ffe9b3; border-radius:8px; text-align:center;">
        <strong>Vuoi le tabelle complete + setup consigliati?</strong><br>
        Ottieni la <strong>Versione PRO</strong> → 
        <a href="https://www.etsy.com/listing/123456789/trolling-calculator-pro" style="color:#d35400;">
            clicca qui
        </a>
    </div>

</section>

<footer style="text-align:center; padding:20px; color:#777;">
    © 2026 Trolling Calculator Pro — Tool Gratis
</footer>

</body>
</html>
